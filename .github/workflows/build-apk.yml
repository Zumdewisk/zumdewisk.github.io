name: Bygg och publicera Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Bygg Zevra APK
    runs-on: ubuntu-latest

    steps:
      - name: Hämta källkod
        uses: actions/checkout@v6

      - name: Konfigurera JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Konfigurera Android SDK
        run: |
          mkdir -p "$HOME/.android/cache"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR" 2>/dev/null || sudo mkdir -p "$SDK_DIR"
          if [ ! -w "$SDK_DIR" ] && command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR"
          fi

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          elif [ -d "$SDK_DIR/cmdline-tools" ]; then
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -maxdepth 3 -name sdkmanager \( -type f -o -type l \) 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Laddar ner Android command-line tools..."
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            mkdir -p "$SDK_DIR/cmdline-tools/latest"
            mv /tmp/cmdline-extract/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-extract
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
            chmod +x "$SDKMANAGER"
          fi

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" 2>&1 | tee /tmp/sdkmanager.log
          SDK_RC=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$SDK_RC" -ne 0 ]; then
            tail -n 20 /tmp/sdkmanager.log | while IFS= read -r line; do
              echo "::error::sdkmanager: $line"
            done
            exit "$SDK_RC"
          fi

      - name: Återställ debug-keystore för signering
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 || vars.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            elif [ -n "$DEBUG_KEYSTORE_B64" ]; then
              printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > debug.keystore
            else
              echo "::error::debug.keystore.base64 saknas i GitHub-repot och ingen DEBUG_KEYSTORE_BASE64-hemlighet hittades! Om en slumpad keystore skapas fungerar inte Google-inloggningen i APK:n. Pusha debug.keystore.base64 till repot eller lägg till innehållet som GitHub Secret DEBUG_KEYSTORE_BASE64."
              exit 1
            fi
          fi

      - name: Kontrollera google-services.json och SHA-1 för Google-inloggning
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              if ! python3 -m json.tool app/google-services.json >/dev/null 2>&1; then
                echo "::error::Innehållet i GOOGLE_SERVICES_JSON är inte giltig JSON. Kontrollera att du kopierade hela filen från { till }."
                exit 1
              fi
            else
              echo "::error::app/google-services.json saknas i GitHub-repot! Lägg till innehållet från app/google-services.json som en GitHub Secret med namnet GOOGLE_SERVICES_JSON (Settings -> Secrets and variables -> Actions) och kör om arbetsflödet."
              exit 1
            fi
          fi

          KEYSTORE_SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            | sed -n 's/.*SHA1:[[:space:]]*\([0-9A-Fa-f:]*\).*/\1/p' | head -n 1)
          if [ -z "$KEYSTORE_SHA1" ]; then
            echo "::error::Kunde inte läsa SHA-1 från debug.keystore. Kontrollera att debug.keystore.base64 / DEBUG_KEYSTORE_BASE64 är giltig."
            exit 1
          fi
          echo "APK debug.keystore SHA-1: $KEYSTORE_SHA1"

          KEYSTORE_SHA1="$KEYSTORE_SHA1" python3 - <<'PY'
          import json, os, sys

          sha1_colon = os.environ["KEYSTORE_SHA1"].strip().upper()
          sha1_norm = sha1_colon.replace(":", "").lower()
          expected_pkg = "com.aistudio.naringai.kzpxvm"

          with open("app/google-services.json", "r", encoding="utf-8") as f:
              gs = json.load(f)

          clients = gs.get("client", [])
          matching_client = None
          for c in clients:
              pkg = c.get("client_info", {}).get("android_client_info", {}).get("package_name")
              if pkg == expected_pkg:
                  matching_client = c
                  break

          if not matching_client:
              found = [c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in clients]
              print(f"::error::google-services.json saknar paketnamnet {expected_pkg} (hittade: {found}). Google-inloggning kommer att misslyckas.")
              sys.exit(1)

          oauth_clients = matching_client.get("oauth_client", [])
          has_web_client = any(oc.get("client_type") == 3 and oc.get("client_id") for oc in oauth_clients)
          if not has_web_client:
              print("::error::google-services.json saknar en Web OAuth-klient (client_type 3 / default_web_client_id). Google-inloggning kommer att misslyckas.")
              sys.exit(1)

          cert_hashes = [
              oc.get("android_info", {}).get("certificate_hash", "").lower()
              for oc in oauth_clients
              if oc.get("client_type") == 1 and oc.get("android_info", {}).get("package_name") == expected_pkg
          ]
          if sha1_norm not in cert_hashes:
              print(f"::error::Signeringsnyckelns SHA-1 ({sha1_colon}) matchar INTE google-services.json ({cert_hashes}). Google-inloggning i APK:n skulle nekas! Kontrollera att debug.keystore.base64 / DEBUG_KEYSTORE_BASE64 och GOOGLE_SERVICES_JSON kommer från samma AI Studio-/Firebase-projekt.")
              sys.exit(1)

          print("Verifierat: debug.keystore SHA-1 och Web OAuth-klient matchar app/google-services.json.")
          PY

      - name: Konfigurera Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Beräkna appversion för in-app-uppdatering
        id: version_meta
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          VERSION_NAME="1.1.${GITHUB_RUN_NUMBER}"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "APK-version för detta bygge: v${VERSION_NAME} (kod ${VERSION_CODE})"

      - name: Bygg signerad APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          set +e
          gradle assembleDebug \
            -PappVersionCode="${{ steps.version_meta.outputs.version_code }}" \
            -PappVersionName="${{ steps.version_meta.outputs.version_name }}" \
            --no-daemon --no-configuration-cache --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true -Dfile.encoding=UTF-8" \
            2>&1 | tee /tmp/gradle-build.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_RC" -ne 0 ]; then
            MATCHES=$({
              grep -E "^(e: |> Task .* FAILED|FAILURE:|\\* What went wrong:|Caused by:|Execution failed)" /tmp/gradle-build.log || true
              sed -n '/^\* What went wrong:/,/^\* Try:/p' /tmp/gradle-build.log || true
            } | awk '!seen[$0]++' | head -n 35)
            if [ -z "$MATCHES" ]; then
              MATCHES=$(tail -n 30 /tmp/gradle-build.log)
            fi
            printf '%s\n' "$MATCHES" | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$BUILD_RC"
          fi

      - name: Förbered APK-fil och version.json för nedladdning
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/debug/app-debug.apk release-apks/Zevra.apk
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_MSG=$(git log -1 --pretty=%s 2>/dev/null || echo "Ny version av Zevra")
          VERSION_CODE="${{ steps.version_meta.outputs.version_code }}" \
          VERSION_NAME="${{ steps.version_meta.outputs.version_name }}" \
          PUBLISHED_AT="$PUBLISHED_AT" \
          COMMIT_MSG="$COMMIT_MSG" \
          python3 - <<'PY'
          import json, os

          data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": "https://github.com/Zumdewisk/NYNYNY/releases/download/latest/Zevra.apk",
              "releaseNotes": f"Senaste uppdateringen: {os.environ['COMMIT_MSG']}",
              "publishedAt": os.environ["PUBLISHED_AT"],
          }
          with open("release-apks/version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PY
          cat release-apks/version.json

      - name: Kontrollera om release-keystore finns
        id: check_release
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.STORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PW" ] && [ -n "$KEY_PW" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bygg Release APK (om keystore-hemligheter finns)
        if: steps.check_release.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$KEYSTORE_PATH"
          gradle assembleRelease \
            -PappVersionCode="${{ steps.version_meta.outputs.version_code }}" \
            -PappVersionName="${{ steps.version_meta.outputs.version_name }}" \
            --no-daemon --no-configuration-cache --stacktrace --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Djava.awt.headless=true -Dfile.encoding=UTF-8"
          cp app/build/outputs/apk/release/app-release.apk release-apks/Zevra-release.apk

      - name: Ladda upp APK som Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Zevra-APK
          path: release-apks/*.apk
          retention-days: 90

      - name: Publicera APK till GitHub Releases (tagg)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-apks/*.apk
            release-apks/version.json
          generate_release_notes: true

      - name: Publicera senaste APK till GitHub Releases (latest)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Zevra – Senaste APK
          body: |
            Automatiskt byggd Android-APK för **Zevra** från `${{ github.ref_name }}` (`${{ github.sha }}`).

            ### Så laddar du ner och installerar på Android
            1. Tryck på **`Zevra.apk`** under **Assets** nedan för att ladda ner appen.
            2. Öppna den nedladdade filen på din Android-telefon och tillåt installation från okända källor om systemet frågar.
          files: |
            release-apks/*.apk
            release-apks/version.json
          make_latest: true
          draft: false
          prerelease: false
